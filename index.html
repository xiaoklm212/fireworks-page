<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>烟花</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #050a18;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #fallback {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #eaf2ff;
    font: 16px/1.6 system-ui, sans-serif;
  }
  #fallback[hidden] {
    display: none;
  }
  #sound-toggle {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 8px;
    background: rgba(10, 18, 38, 0.55);
    color: #eaf2ff;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 2;
  }
  #sound-toggle svg {
    width: 22px;
    height: 22px;
  }
  #sound-toggle .icon-off {
    display: none;
  }
  body.sound-off #sound-toggle .icon-on {
    display: none;
  }
  body.sound-off #sound-toggle .icon-off {
    display: block;
  }
  #blessing {
    position: fixed;
    z-index: 3;
    pointer-events: none;
    margin: 0;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.72);
    transition: opacity 0.35s ease, transform 0.35s ease;
    will-change: opacity, transform;
    font-size: clamp(24px, 6vw, 46px);
    line-height: 1.15;
    white-space: nowrap;
    color: #f8fbff;
  }
  #blessing.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  #blessing.fade {
    opacity: 0;
    transform: translate(-50%, -85%) scale(1.08);
    transition: opacity 0.9s ease, transform 1.1s ease;
  }
  #blessing-text {
    display: inline-block;
  }
  #blessing-text.blessing-style-2 {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    font-weight: 300;
    color: #f8fbff;
    text-shadow: 0 0 8px rgba(190, 220, 255, 0.8), 0 0 26px rgba(140, 180, 255, 0.45);
  }
  #blessing-text.blessing-style-5 {
    font-family: "STKaiti", "KaiTi", "Kaiti SC", serif;
    font-weight: 700;
    color: #e7e0d2;
    text-shadow: 0 0 18px rgba(255, 255, 255, 0.22), 0 2px 3px rgba(0, 0, 0, 0.5);
    transform: rotate(-1.5deg);
  }
  #blessing-text .blessing-char {
    display: inline-block;
    transition: opacity 0.75s ease, transform 0.95s cubic-bezier(0.22, 0.61, 0.36, 1), filter 0.75s ease;
    will-change: opacity, transform, filter;
  }
  #blessing-text.dissolve .blessing-char {
    opacity: 0;
    transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.2);
    filter: blur(4px);
  }
  #stardust {
    position: fixed;
    z-index: 2;
    pointer-events: none;
    width: 0;
    height: 0;
  }
  #stardust span {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
    animation: stardust-burst 0.9s ease-out forwards;
    box-shadow: 0 0 8px rgba(255, 220, 150, 0.9);
  }
  @keyframes stardust-burst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); }
  }
</style>
</head>
<body>
<canvas id="fireworks" aria-label="烟花效果"></canvas>
<div id="fallback" hidden>当前浏览器不支持 Canvas。</div>
<button id="sound-toggle" type="button" aria-label="声音开关" aria-pressed="true">
  <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
    <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
    <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
  </svg>
  <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
    <line x1="22" y1="9" x2="16" y2="15"></line>
    <line x1="16" y1="9" x2="22" y2="15"></line>
  </svg>
</button>
<div id="blessing" role="status" aria-live="polite"><span id="blessing-text"></span></div>
<div id="stardust" aria-hidden="true"></div>
<script>
(function () {
  'use strict';
  const DEFAULT_CAP = 1400;
  const LOW_CAP = 800;
  const LOW_FPS = 45;
  const FPS_WINDOW = 120;
  const TAU = Math.PI * 2;
  const PALETTE = ['#ffd76e', '#ff9ad5', '#8fe3ff', '#b7ffa8', '#ff8f70'];

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function makeWorld(width, height, cap = DEFAULT_CAP) {
    return { width, height, cap, time: 0, rockets: [], particles: [], stars: [], events: [] };
  }

  function addParticle(world, particle) {
    if (world.particles.length >= world.cap) world.particles.shift();
    world.particles.push(particle);
  }

  function pickShape() {
    const r = Math.random();
    if (r < 0.6) return 'sphere';
    if (r < 0.8) return 'ring';
    return 'willow';
  }

  function launchRocket(world, targetX, targetY, opts = {}) {
    const startX = opts.startX ?? targetX;
    const startY = world.height + 24;
    const dx = targetX - startX;
    const dy = targetY - startY;
    const dist = Math.hypot(dx, dy) || 1;
    const speed = opts.speed ?? rand(620, 760);
    const rocket = {
      x: startX,
      y: startY,
      vx: (dx / dist) * speed,
      vy: (dy / dist) * speed,
      targetX,
      targetY,
      color: opts.color ?? pick(PALETTE),
      shape: opts.shape ?? pickShape(),
      user: opts.user === true,
      trailTimer: 0
    };
    world.rockets.push(rocket);
    return rocket;
  }

  function explodeAt(world, x, y, color, shape = 'sphere', user = false) {
    const counts = { sphere: 140, ring: 100, willow: 110 };
    const speedBase = { sphere: 190, ring: 150, willow: 120 };
    const count = counts[shape] ?? 70;
    const base = speedBase[shape] ?? 150;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * TAU + rand(-0.08, 0.08);
      const speed = shape === 'ring'
        ? base * rand(0.92, 1.08)
        : base * Math.pow(Math.random(), 0.55);
      const life = shape === 'willow' ? rand(1.6, 2.6) : rand(0.9, 1.5);
      addParticle(world, {
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life,
        maxLife: life,
        size: rand(1.2, 2.4),
        color,
        gravity: shape === 'willow' ? 45 : 90,
        drag: shape === 'willow' ? 0.92 : 0.88,
        trail: shape !== 'ring',
        twinkle: Math.random() < 0.25,
        phase: 0
      });
    }
    world.events.push({ type: 'explosion', x, y, user: user === true });
  }

  function updateWorld(world, dt) {
    const maxStep = 1 / 60;
    let remaining = Math.max(0, dt);
    while (remaining > 0) {
      const step = Math.min(remaining, maxStep);
      const rocketsLeft = [];
      for (const rocket of world.rockets) {
        rocket.x += rocket.vx * step;
        rocket.y += rocket.vy * step;
        rocket.trailTimer -= step;
        if (rocket.trailTimer <= 0) {
          rocket.trailTimer = 0.02;
          addParticle(world, {
            x: rocket.x,
            y: rocket.y,
            vx: rand(-8, 8),
            vy: rand(-8, 8),
            life: 0.18,
            maxLife: 0.18,
            size: rand(0.8, 1.6),
            color: rocket.color,
            gravity: 0,
            drag: 1,
            trail: false,
            twinkle: false,
            phase: 0
          });
        }
        const dx = rocket.targetX - rocket.x;
        const dy = rocket.targetY - rocket.y;
        if (dx * dx + dy * dy < 900) {
          explodeAt(world, rocket.targetX, rocket.targetY, rocket.color, rocket.shape, rocket.user);
        } else {
          rocketsLeft.push(rocket);
        }
      }
      world.rockets = rocketsLeft;

      const particlesLeft = [];
      for (const p of world.particles) {
        p.life -= step;
        if (p.life <= 0) continue;
        const dragFactor = Math.pow(p.drag, step);
        p.vx *= dragFactor;
        p.vy *= dragFactor;
        p.vy += p.gravity * step;
        p.x += p.vx * step;
        p.y += p.vy * step;
        p.phase += step * 8;
        particlesLeft.push(p);
      }
      world.particles = particlesLeft;
      world.time += step;
      remaining -= step;
    }
  }

  function assessPerformance(fpsWindow) {
    if (fpsWindow.length < 30) return { quality: 'normal', cap: DEFAULT_CAP };
    const recent = fpsWindow.slice(-30);
    const avg = recent.reduce((sum, fps) => sum + fps, 0) / recent.length;
    if (avg < LOW_FPS) return { quality: 'low', cap: LOW_CAP };
    return { quality: 'normal', cap: DEFAULT_CAP };
  }

  function createStars(world, count = 70) {
    world.stars.length = 0;
    for (let i = 0; i < count; i++) {
      world.stars.push({
        x: Math.random() * world.width,
        y: Math.random() * world.height * 0.8,
        r: rand(0.3, 1.3),
        phase: rand(0, TAU),
        speed: rand(0.5, 2)
      });
    }
    return world.stars;
  }

  const api = {
    DEFAULT_CAP,
    LOW_CAP,
    LOW_FPS,
    FPS_WINDOW,
    PALETTE,
    rand,
    pick,
    makeWorld,
    addParticle,
    pickShape,
    launchRocket,
    explodeAt,
    updateWorld,
    assessPerformance,
    createStars
  };

  if (typeof window !== 'undefined') window.FireworksCore = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})();

  let cssWidth = window.innerWidth;
  let cssHeight = window.innerHeight;
  let dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
  let world = null;
  let rafId = 0;
  let lastTime = 0;
  let fpsSamples = [];
  let fpsAccum = 0;
  let fpsFrames = 0;
  let autoTimer = 0;
  let lowQuality = false;
  let soundOn = true;
  let audioUnlocked = false;
  const soundButton = document.getElementById('sound-toggle');
  const soundPlayers = {};
  for (const id of SOUND_IDS) {
    const audio = new Audio(SOUND_DATA[id]);
    audio.volume = 0.7;
    soundPlayers[id] = audio;
  }

  function resize() {
    cssWidth = window.innerWidth;
    cssHeight = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!world) {
      world = core.makeWorld(cssWidth, cssHeight, core.DEFAULT_CAP);
    } else {
      world.width = cssWidth;
      world.height = cssHeight;
    }
    core.createStars(world, 70);
  }

  function launchAt(x, y) {
    core.launchRocket(world, x, y, {
      color: core.pick(core.PALETTE),
      shape: core.pickShape(),
      user: true
    });
  }

  function unlockAudio() {
    if (audioUnlocked || !soundPlayers.s1) return;
    audioUnlocked = true;
    const probe = soundPlayers.s1.cloneNode();
    probe.volume = 0;
    probe.play().catch(() => {});
  }

  function playExplosionSound() {
    if (!soundOn || !audioUnlocked) return;
    const id = core.pick(SOUND_IDS);
    const audio = soundPlayers[id];
    if (!audio) return;
    audio.currentTime = 0;
    audio.play().catch(() => {});
  }

  function showBlessing(x, y) {
    if (!blessingEl) return;
    const phrase = core.pick(BLESSINGS);
    blessingText.className = core.pick(['blessing-style-2', 'blessing-style-5']);
    blessingText.innerHTML = '';
    for (const ch of phrase) {
      const span = document.createElement('span');
      span.className = 'blessing-char';
      span.textContent = ch;
      span.style.setProperty('--dx', (Math.random() * 150 - 75).toFixed(1) + 'px');
      span.style.setProperty('--dy', (30 + Math.random() * 110).toFixed(1) + 'px');
      span.style.setProperty('--rot', (Math.random() * 50 - 25).toFixed(1) + 'deg');
      span.style.transitionDelay = (Math.random() * 0.12).toFixed(3) + 's';
      blessingText.appendChild(span);
    }
    const pad = 24;
    const half = 80;
    const left = Math.min(Math.max(x, pad + half), cssWidth - pad - half);
    const top = Math.min(Math.max(y, pad + 40), cssHeight - pad - 20);
    blessingEl.style.left = left + 'px';
    blessingEl.style.top = top + 'px';
    blessingEl.classList.remove('show', 'fade');
    void blessingEl.offsetWidth;
    blessingEl.classList.add('show');
    scatterStardust(x, y);
    clearTimeout(blessingTimer);
    blessingTimer = setTimeout(() => {
      blessingText.classList.add('dissolve');
      blessingEl.classList.add('fade');
    }, 850);
  }

  function scatterStardust(x, y) {
    const host = document.getElementById('stardust');
    if (!host) return;
    clearTimeout(stardustTimer);
    host.innerHTML = '';
    host.style.left = x + 'px';
    host.style.top = y + 'px';
    const colors = ['#ffe9a8', '#fff6d8', '#ffd76e', '#b7ffa8'];
    const count = 12;
    for (let i = 0; i < count; i++) {
      const span = document.createElement('span');
      const angle = (i / count) * Math.PI * 2 + Math.random() * 0.4;
      const dist = 40 + Math.random() * 70;
      span.style.setProperty('--dx', (Math.cos(angle) * dist).toFixed(1) + 'px');
      span.style.setProperty('--dy', (Math.sin(angle) * dist).toFixed(1) + 'px');
      span.style.animationDelay = (Math.random() * 0.08).toFixed(3) + 's';
      span.style.background = colors[i % colors.length];
      host.appendChild(span);
    }
    stardustTimer = setTimeout(() => {
      host.innerHTML = '';
    }, 1100);
  }

  function scheduleAuto() {
    const delay = lowQuality ? core.rand(2200, 3200) : core.rand(1200, 2200);
    autoTimer = setTimeout(() => {
      const x = core.rand(cssWidth * 0.1, cssWidth * 0.9);
      const y = core.rand(cssHeight * 0.15, cssHeight * 0.6);
      launchAt(x, y);
      scheduleAuto();
    }, delay);
  }

  function render() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5, 10, 24, 0.22)';
    ctx.fillRect(0, 0, cssWidth, cssHeight);
    ctx.globalCompositeOperation = 'lighter';
    const time = world.time;
    for (const star of world.stars) {
      const a = 0.35 + 0.3 * Math.sin(time * star.speed + star.phase);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + Math.max(0.08, a).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const rocket of world.rockets) {
      ctx.fillStyle = rocket.color;
      ctx.beginPath();
      ctx.arc(rocket.x, rocket.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const p of world.particles) {
      const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
      ctx.globalAlpha = alpha * 0.9;
      ctx.fillStyle = p.color;
      const size = p.twinkle ? p.size * (0.7 + 0.5 * Math.abs(Math.sin(p.phase))) : p.size;
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const dt = lastTime ? Math.min((now - lastTime) / 1000, 0.1) : 0.016;
    lastTime = now;
    core.updateWorld(world, dt);
    for (const event of world.events) {
      if (event.type === 'explosion') {
        playExplosionSound();
        if (event.user) showBlessing(event.x, event.y);
      }
    }
    world.events.length = 0;
    render();
    fpsAccum += dt;
    fpsFrames++;
    if (fpsAccum >= 1) {
      fpsSamples.push(fpsFrames / fpsAccum);
      if (fpsSamples.length > core.FPS_WINDOW) fpsSamples.shift();
      const result = core.assessPerformance(fpsSamples);
      if (result.quality === 'low' && !lowQuality) {
        lowQuality = true;
        world.cap = result.cap;
      } else if (result.quality === 'normal' && lowQuality && world.particles.length < core.LOW_CAP) {
        lowQuality = false;
        world.cap = result.cap;
      }
      fpsAccum = 0;
      fpsFrames = 0;
    }
    rafId = requestAnimationFrame(frame);
  }

  function start() {
    cancelAnimationFrame(rafId);
    lastTime = 0;
    rafId = requestAnimationFrame(frame);
  }

  function stop() {
    cancelAnimationFrame(rafId);
    clearTimeout(autoTimer);
  }

  window.addEventListener('resize', resize);
  document.addEventListener('pointerdown', (event) => {
    if (soundButton && event.target.closest('#sound-toggle')) return;
    unlockAudio();
    const rect = canvas.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * cssWidth;
    const y = ((event.clientY - rect.top) / rect.height) * cssHeight;
    launchAt(x, y);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stop();
    } else {
      start();
      scheduleAuto();
    }
  });
  if (soundButton) {
    soundButton.addEventListener('click', (event) => {
      event.stopPropagation();
      soundOn = !soundOn;
      document.body.classList.toggle('sound-off', !soundOn);
      soundButton.setAttribute('aria-pressed', String(soundOn));
    });
  }
  resize();
  start();
  scheduleAuto();
})();
</script>
</body>
</html>
